<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="top-nav">
        <a href="{{ url_for('home') }}" class="brand">
            just in
            <span>Document Creation</span>
        </a>
        <nav class="nav-links">
            <a href="{{ url_for('home') }}">Back to Home</a>
            <a href="{{ url_for('logout') }}">Log Out</a>
        </nav>
    </header>

    <main class="page-shell">
        <div class="bento-card" style="max-width: 680px; margin: 0 auto;">
            <div class="card-index">03</div>
            <h2>Add New Document</h2>
            <p class="subtitle">New submissions default to pending until approved by an administrator.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-box {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form action="/add" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <label for="title">Document Title *</label>
                <input type="text" id="title" name="title" required placeholder="Enter document title">

                <label for="content">Content</label>
                <textarea id="content" name="content" rows="8" placeholder="Type document text here..."></textarea>

                <label for="department_id">Department ID (Optional)</label>
                <input type="number" id="department_id" name="department_id" placeholder="e.g. 101">

                <div class="action-bar">
                    <button type="submit">Save Document</button>
                    <a href="{{ url_for('home') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
